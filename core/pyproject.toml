[project]
name = "tetris-core"
version = "0.1.0"
description = "Tengen-style Tetris game core: pure Python, no UI dependencies"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tetris_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
